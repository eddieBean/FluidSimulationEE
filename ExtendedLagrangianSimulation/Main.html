<html>
    <head>
        <title>2D Fluid Simulation</title>
        <style>
            * {padding: 0; margin: 0;}
            canvas { display: block; margin: 20px auto;}
            /* body {background: #242321;} */
            body {background: #DDDDDD;}
            #controls{
                position: absolute;
                left: 20px;
                top: 20px;
                width: 320px;
                background: rgba(0,0,0,0.6);
                color: #fff;
                border: 1px solid #555;
                padding: 8px;
                font-family: Arial, sans-serif;
                font-size: 12px;
                max-height: 600px;
                overflow: auto;
            }
            #deltaTime{
                position: absolute;
                left: 360px;
                top: 20px;
                width: 300px;
                height: 220px;
                background: rgba(0,0,0,0.5);
                color: #fff;
                border: 1px solid #555;
                padding: 8px;
                font-family: monospace;
                font-size: 12px;
                resize: none;
            }
            .sliderRow{ display:flex; align-items:center; margin:6px 0; }
            .sliderRow label{ width: 140px; }
            .sliderRow input[type=range]{ flex: 1; margin: 0 8px; }
            .sliderValue{ width: 50px; text-align: right; }
        </style>
    </head>

    <body>
        <div>
            <canvas id="canvas" width="1781px" height="712px" style="border: solid 1px black"></canvas>
            <button id="startSimulation" onClick="mainLoop()">Start Simulation</button>
            <div id="controls" style="position:static"></div>
            <textarea id="deltaTime" style="position:static" readonly></textarea>
        </div>

        <script src="Playground.js"></script>
        <script src="Simulation.js"></script>
        <script src="Vector2.js"></script>
        <script src="DrawUtils.js"></script>
        <script src="Particle.js"></script>
        <script src="FluidHashGrid.js"></script>
        <script src="ParticleEmitter.js"></script>
        <script src="Spring.js"></script>
        <script src="shapes/Shape.js"></script>
        <script src="shapes/Polygon.js"></script>
        <script src="shapes/Circle.js"></script>
        <script src="shapes/Rectangle.js"></script>
        <script src="WheresMyWaterSimulation.js"></script>

        <script>
            var canvas = document.getElementById("canvas");
            var ctx = canvas.getContext("2d");
            var textbox = document.getElementById("deltaTime");
            
            // Logging system global state
            let logBuffer = [];                 // Array storing CSV rows (strings)
            let frameStartTime = 0;             // Timestamp marking start of current frame
            let currentMemoryMB = 0;            // Cache of latest memory measurement
            let startTime = 0;                  // Page load/simulation start timestamp
            let isPaused = false;               // Pause/resume state

            let playground = new Playground();

            // build slider UI bound to playground.simulation properties
            function buildControls(){
                console.profile("startup");
                let sim = playground.simulation;
                let container = document.getElementById('controls');

                function addSlider(key, label, min, max, step, format){
                    let row = document.createElement('div'); row.className = 'sliderRow';
                    let lab = document.createElement('label'); lab.textContent = label;
                    let range = document.createElement('input'); range.type = 'range'; range.min = min; range.max = max; range.step = step;
                    // set initial value from sim if exists, otherwise fallback to midpoint
                    let initial = (sim[key] !== undefined) ? sim[key] : ((min-0 + max-0)/2);
                    range.value = initial;
                    let val = document.createElement('div'); val.className = 'sliderValue'; val.textContent = (format ? format(initial) : initial);

                    range.addEventListener('input', function(){
                        let v = (range.step.indexOf('.') >= 0) ? parseFloat(range.value) : (range.value|0);
                        if(format) val.textContent = format(v); else val.textContent = v;
                        // apply to simulation
                        if(key === 'INTERACTION_RADIUS'){
                            sim.INTERACTION_RADIUS = v;
                            // rebuild hash grid to use new radius
                            sim.fluidHashGrid = new FluidHashGrid(sim.INTERACTION_RADIUS);
                            sim.fluidHashGrid.initialize(sim.particles);
                        } else if(key === 'PARTICLE_SIZE'){
                            sim.PARTICLE_SIZE = v;
                        } else if(sim[key] !== undefined){
                            sim[key] = v;
                        }
                    });

                    row.appendChild(lab); row.appendChild(range); row.appendChild(val);
                    container.appendChild(row);
                }

                addSlider('PARTICLE_SIZE','Particle Size',1,10,1,function(v){ return v.toFixed(0); });
                addSlider('INFLOW_VELOCITY','Inflow Velocity',0,20,0.1,function(v){ return v.toFixed(2); });
                addSlider('REST_DENSITY','Rest Density',0,5,0.1,function(v){ return v.toFixed(2); });
                addSlider('K_NEAR','K_NEAR',0,10,0.1,function(v){ return v.toFixed(2); });
                addSlider('K','K (stiffness)',0,5,0.05,function(v){ return v.toFixed(2); });
                addSlider('INTERACTION_RADIUS','Interaction Radius',1,50,1,function(v){ return v.toFixed(0); });
                addSlider('SIGMA','Viscosity σ',0,1,0.01,function(v){ return v.toFixed(2); });
                addSlider('WALL_PRESSURE_MIN','Wall Pressure Min',0,1,0.05,function(v){ return v.toFixed(2); });
                addSlider('WALL_PRESSURE_MAX','Wall Pressure Max',0,2,0.05,function(v){ return v.toFixed(2); });
                addSlider('WALL_FRICTION','Wall Friction',0,0.5,0.01,function(v){ return v.toFixed(3); });

                // ensure initial values from sim are reflected
                // fire input on each range to set UI text
                Array.from(container.querySelectorAll('input[type=range]')).forEach(r => r.dispatchEvent(new Event('input')));
            };


            function updatePlayground(dt){
                Clear();
                playground.update(0.016);
                playground.draw();
            }

            /**
             * Get memory statistics using measureUserAgentSpecificMemory() with fallback
             */
            async function getMemoryStats() {
                try {
                    if (performance.measureUserAgentSpecificMemory) {
                        const estimate = await performance.measureUserAgentSpecificMemory();
                        const usedMemoryMB = (estimate.bytes / 1024 / 1024).toFixed(2);
                        const breakdown = estimate.breakdown.map(item => ({
                            attribution: item.attribution || 'Unknown',
                            bytes: (item.bytes / 1024 / 1024).toFixed(2)
                        }));
                        return { usedMemoryMB, breakdown };
                    } else if (performance.memory) {
                        // Fallback to performance.memory (Chrome/Edge only)
                        const usedMemoryMB = (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(2);
                        return { usedMemoryMB, breakdown: [] };
                    } else {
                        // No API available
                        console.warn('Memory measurement API not available');
                        return { usedMemoryMB: 'N/A', breakdown: [] };
                    }
                } catch (e) {
                    console.warn('Error measuring memory:', e.message);
                    return { usedMemoryMB: 'N/A', breakdown: [] };
                }
            }

            /**
             * Calculate CPU load as percentage relative to 60 FPS target
             */
            function getCPULoad() {
                const sim = playground.simulation;
                if (!sim || !sim.dt) return 0;
                const targetFrameMs = 1000.0 / 60.0;  // 16.67ms for 60 FPS
                const cpuLoad = Math.min(100, (sim.dt * 1000 / targetFrameMs) * 100);
                return cpuLoad.toFixed(1);
            }

            /**
             * Log current frame data to CSV buffer
             */
            async function logToCSV() {
                const sim = playground.simulation;
                if (!sim) return;

                // Calculate frame generation time
                const frameGenTime = performance.now() - frameStartTime;
                
                // Get memory stats (async operation)
                const memStats = await getMemoryStats();
                currentMemoryMB = memStats.usedMemoryMB;
                
                // Calculate metrics
                const cpuLoad = getCPULoad();
                const elapsedTime = (performance.now() - startTime) / 1000;
                const fps = sim.dt > 0 ? (1.0 / sim.dt).toFixed(1) : 0;
                
                // Construct CSV row
                const frameNum = logBuffer.length;
                const deltaTimeStr = sim.dt ? sim.dt.toFixed(4) : '0.0000';
                const csvRow = `${frameNum},${deltaTimeStr},${fps},${cpuLoad},${frameGenTime.toFixed(2)},${currentMemoryMB},${elapsedTime.toFixed(2)}`;
                
                logBuffer.push(csvRow);
            }

            /**
             * Download CSV data from logBuffer
             */
            function downloadCSV() {
                if (logBuffer.length === 0) {
                    alert('No data to export. Run the simulation first.');
                    return;
                }

                const header = 'Frame,DeltaTime(s),FPS,CPULoad(%),FrameGenTime(ms),UsedMemory(MB),TotalElapsed(s)';
                const csvContent = header + '\n' + logBuffer.join('\n');
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `lagrangian_sim_log_${Date.now()}.csv`);
                link.style.visibility = 'hidden';
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                URL.revokeObjectURL(url);
                console.log(`CSV exported successfully with ${logBuffer.length} entries.`);
            }

            async function mainLoop(){
                window.requestAnimationFrame(mainLoop);
                
                if (isPaused) {
                    return;
                }

                frameStartTime = performance.now();
                updatePlayground(0.016);  // Fixed timestep for now
                
                // Log frame data (async operation)
                try {
                    await logToCSV();
                } catch (e) {
                    console.warn('Error logging frame data:', e);
                }

                // Update on-screen display
                const sim = playground.simulation;
                if (textbox && sim) {
                    const fps = sim.dt > 0 ? (1.0 / sim.dt).toFixed(1) : '0.0';
                    const frameGenTime = performance.now() - frameStartTime;
                    textbox.value = `Frame: ${sim.frameNr || 0} | FPS: ${fps} | Memory: ${currentMemoryMB}MB | FrameTime: ${frameGenTime.toFixed(2)}ms | Logged Frames: ${logBuffer.length}`;
                }
            }

            function Clear(){
                // ctx.fillStyle = "#242321";
                ctx.fillStyle = "#DDDDDD";
                ctx.fillRect(0,0, canvas.width, canvas.height);
            }

            function getMousePos(canvas, evt){
                var rect = canvas.getBoundingClientRect();
                return {
                    x: evt.clientX - rect.left,
                    y: evt.clientY - rect.top
                };
            }

            // Initialize start time when page loads
            document.addEventListener('DOMContentLoaded', function() {
                startTime = performance.now();
                buildControls();
                console.log('Logging system initialized. Press "e" to export CSV, "p" to pause/resume, "m" to step one frame.');
            });

            // Keyboard event handler for pause, step, and export
            document.addEventListener('keydown', function(evt) {
                if (evt.key === 'e' || evt.key === 'E') {
                    downloadCSV();
                } else if (evt.key === 'p' || evt.key === 'P') {
                    isPaused = !isPaused;
                    console.log(isPaused ? 'Simulation paused' : 'Simulation resumed');
                } else if (evt.key === 'm' || evt.key === 'M') {
                    if (isPaused) {
                        frameStartTime = performance.now();
                        updatePlayground(0.016);
                        logToCSV().catch(e => console.warn('Error in single step:', e));
                        console.log('Single frame stepped');
                    }
                }
            });

            canvas.addEventListener('mousemove', function(evt){
                let mouse = getMousePos(canvas,evt);
                playground.onMouseMove(new Vector2(mouse.x,mouse.y));
            }, false)

            canvas.addEventListener('mousedown', function(evt){
                playground.onMouseDown(evt.button);
            }, false)

            canvas.addEventListener('mouseup', function(evt){
                playground.onMouseUp(evt.button);
            }, false)




        </script>


    </body>






</html>
